<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站已永久停运</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 550px;
        }
        .warning-icon {
            font-size: 80px;
            color: #ff5252;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 32px;
            color: #ffffff;
            margin-bottom: 16px;
        }
        .desc-main {
            font-size: 18px;
            color: #bdbdbd;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .split-line {
            width: 100px;
            height: 1px;
            background: #444;
            margin: 32px auto;
        }
        .tips-text {
            font-size: 15px;
            color: #888888;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="warning-icon">⚠</div>
        <h1>网站已永久停运</h1>
        <p class="desc-main">
            本站因遭遇网络攻击现已全面终止运营永久关闭
            <br>
            不再提供任何资源下载访问及相关服务
        </p>
        <div class="split-line"></div>
        <p class="tips-text">
            感谢各位曾经的支持与陪伴
            <br>
            域名相关内容不再维护
        </p>
    </div>
</body>
</html>
